<!DOCTYPE html>
<html>
<head>
    <title>Juego 1 - virtix</title>
    <style>
        body { text-align:center; font-family:Arial; }
        button { font-size:20px; padding:15px 25px; border-radius:8px; cursor:pointer; border:none; background-color:#4CAF50; color:white; }
        button:hover { background-color:#45a049; }
        .status { margin-top:20px; font-size:18px; }
    </style>
</head>
<body>

<h1>🎮 Juego 1: 100 Clicks en 40s</h1>
<p>Haz 100 clicks antes de que se acaben los 40 segundos para ganar 1 coin.</p>

<button id="clickButton">Click Me!</button>

<div class="status">
    <p>Clicks: <span id="clickCount">0</span>/100</p>
    <p>Tiempo restante: <span id="timer">40</span> segundos</p>
</div>

<script>
let clicks = 0;
let timeLeft = 40;
const userId = {{ user.id }};

// Inicia temporizador
const timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if(timeLeft <= 0) {
        clearInterval(timerInterval);
        alert('Se acabó el tiempo. Intenta de nuevo.');
        window.location.href = '/';
    }
}, 1000);

// Contador de clicks
document.getElementById('clickButton').addEventListener('click', () => {
    clicks++;
    document.getElementById('clickCount').innerText = clicks;

    if(clicks >= 100 && timeLeft > 0) {
        // Ganó
        fetch(`/ganar/${userId}`)
        .then(response => {
            if(response.ok) {
                alert('¡Felicidades! Ganaste 1 coin 🎉');
                window.location.href = '/';
            }
        });
    }
});
</script>

</body>
</html>
